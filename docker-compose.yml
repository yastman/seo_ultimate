services:
  db:
    image: mariadb:10.11
    container_name: demo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demo_db}
      MYSQL_USER: ${MYSQL_USER:-demo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo_pass}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:5.3.0
    container_name: demo_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  db_data:
