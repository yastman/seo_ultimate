[pytest]
# Pytest configuration. Keep pytest settings here, not in pyproject.toml.

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src/llm_keywords_pipeline
    --cov-report=term-missing:skip-covered
    --cov-report=html:artifacts/pytest/htmlcov
    --cov-report=json:artifacts/pytest/coverage.json
    --color=yes
    -p no:pastebin
    -p no:nose
    -p no:doctest

# Targeted warning filters (no global warning suppression).
# New warnings from project code will surface in CI by default.
filterwarnings =
    # pymorphy2 uses deprecated pkg_resources API (third-party, tracked in #12)
    ignore::DeprecationWarning:pymorphy2
    # runpy warns when a module is already in sys.modules before -m execution;
    # harmless for our modules that guard with `if __name__ == "__main__"`
    ignore::RuntimeWarning:runpy

# Parallel execution (optional):
#   uv run pytest -n auto --dist loadfile

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: end-to-end tests on real data (deselect with '-m "not e2e"')

# Coverage config is stored in `.coveragerc`.
