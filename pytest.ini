[pytest]
# Pytest configuration. Keep pytest settings here, not in pyproject.toml.

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/llm_keywords_pipeline
    --cov-report=term-missing:skip-covered
    --cov-report=html:artifacts/pytest/htmlcov
    --cov-report=json:artifacts/pytest/coverage.json
    --color=yes
    -p no:pastebin
    -p no:nose
    -p no:doctest

# Parallel execution (optional):
#   uv run pytest -n auto --dist loadfile

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: end-to-end tests on real data (deselect with '-m "not e2e"')

# Coverage config is stored in `.coveragerc`.
