[project]
name = "llm-keywords-pipeline"
version = "0.1.0"
description = "Python toolkit for automating SEO keyword, content, and metadata validation workflows."
readme = "README.md"
license = "MIT"
authors = [
    { name = "yastman" },
]
requires-python = ">=3.12"
keywords = [
    "seo",
    "content-automation",
    "keywords",
    "llm",
    "nlp",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "requests>=2.32",
    "toml>=0.10",
    "pandas>=2.2",
    "markdown>=3.8",
    "openpyxl>=3.1",
    "pydantic>=2",
    "setuptools<71",
]

[dependency-groups]
nlp = [
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "pymorphy3-dicts-uk>=2.4",
    "natasha>=1.6",
    "razdel>=0.5",
    "navec>=0.10",
    "slovnet>=0.6",
    "spacy>=3.8",
    "snowballstemmer>=2.2",
]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "mysql-connector-python>=9.0",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.5",
]

[project.urls]
Homepage = "https://github.com/yastman/llm-keywords-pipeline"
Repository = "https://github.com/yastman/llm-keywords-pipeline"
Issues = "https://github.com/yastman/llm-keywords-pipeline/issues"

[project.scripts]
llm-keywords-check-seo = "llm_keywords_pipeline.validate.seo:main"
llm-keywords-density = "llm_keywords_pipeline.validate.density:main"
llm-keywords-audit-brands = "llm_keywords_pipeline.audit.ner_brands:main"
llm-keywords-audit-water = "llm_keywords_pipeline.audit.water:main"

[tool.uv]
default-groups = ["nlp", "dev", "test"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".github_repos",
    "archive",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"archive/*" = ["E402", "E722", "E741", "E721", "F401", "F811", "F841", "B007", "B905"]
".github_repos/*" = ["E402", "E722", "E741", "E721", "F401", "F811", "F841", "B007", "B905"]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src/llm_keywords_pipeline/core/text.py"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_keywords_pipeline"]
